<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>আমার পেজ</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px;
      background: #f0f4f8;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 30px;
      max-width: 400px;
      margin: auto;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    img {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #4CAF50;
    }
    h2 { color: #333; }
    p { color: #666; }
    a {
      display: inline-block;
      margin-top: 15px;
      padding: 10px 25px;
      background: #4CAF50;
      color: white;
      border-radius: 25px;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="photo.jpg" alt="আমার ছবি">
    <h2>তোমার নাম লেখো</h2>
    <p>তোমার পরিচয় বা যেকোনো তথ্য</p>
    <a href="https://তোমার-website.com">আমার Website দেখো</a>
  </div>
</body>
</html>
